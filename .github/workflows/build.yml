name: Rebuild README and website

on:
  push:
    branches: [main]
    paths: ["data/papers.json", "site/template.html", "scripts/build_site.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html CITATION.cff
          git diff --cached --quiet || git commit -m "Rebuild README and website from papers.json"
          git push
